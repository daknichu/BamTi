<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10151d"><link rel="manifest" href="manifest.webmanifest"><title>BamTi · 출격 도우미 0.4.7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#252d37,#10151d 60%);color:#f1ebdc;font:17px/1.5 system-ui,sans-serif}main{width:min(100%,480px);margin:auto;padding:32px 22px;min-height:95svh;display:grid;align-content:center}h1{font:normal clamp(64px,18vw,96px)/1 Georgia,serif;color:#e4c687;margin:0}p{color:#bfbdba}button,label{font:inherit;cursor:pointer}label{position:relative;display:block;text-align:center;border-radius:14px;background:#e4c687;color:#211e18;padding:18px;font-weight:bold;margin-top:32px}label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}label:focus-within{outline:3px solid white}header{display:flex;justify-content:space-between;align-items:center}header b{font:28px Georgia;color:#e4c687}button{color:#cec6b6;background:transparent;border:1px solid #5a574f;border-radius:9px;padding:7px 12px}.clock{text-align:center;padding:42px 0}#time{display:block;font-size:clamp(64px,19vw,96px);line-height:1.2;font-variant-numeric:tabular-nums}article{border-top:1px solid #625945;padding-top:20px}h2{font-size:17px;margin:0}#castle{white-space:pre-line;line-height:1.8}a{color:#e4c687}#message:empty{display:none}
.album{background:transparent;color:#e4c687;border:1px solid #625945;margin-top:12px}#board{position:relative;aspect-ratio:1;background-size:100% 100%;margin:12px 0}#board button{position:absolute;transform:translate(-50%,-50%);padding:2px;min-width:20px;border-radius:50%;font-size:12px;background:#171d25}#board button[aria-pressed=true]{background:#ebcb87;color:#141414}select{padding:8px;max-width:55%}</style></head><body><main>
<section id="home"><h1>BamTi</h1><p>밤의 통치자 출격 보조 앱<br>게임 지도를 촬영하거나 사진첩에서 선택하세요.</p><label>지도 사진 찍기<input id="camera" type="file" accept="image/*" capture="environment" aria-label="지도 사진 찍기"></label><label class="album">앨범에서 선택<input id="photo" aria-label="앨범에서 선택" type="file" accept="image/*"></label><p id="error" role="status"></p></section>
<section id="run" hidden><header><b>BamTi</b><button id="end">출격 종료</button></header><div class="clock"><span id="next"></span><strong id="time"></strong><span id="message" role="status"></span></div><article><h2>중앙 성채</h2><p id="castle" role="status"></p><button id="manual" hidden>지도에서 교회 표시</button><section id="refine" hidden><p>지형과 밤의 왕을 고르고, 지도에서 보이는 교회 위치를 누르세요. 다시 누르면 취소됩니다.</p><select aria-label="지형" id="terrain"></select> <select aria-label="밤의 왕" id="boss"></select><div id="board"></div><button id="back">타이머로 돌아가기</button></section></article></section>
</main><script src="recognition.js"></script><script src="iconscan.js"></script><script src="run.js"></script></body></html>
